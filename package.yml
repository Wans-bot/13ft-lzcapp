package: cloud.lazycat.app.thirteenft
version: 1.3.0-2
name: 13ft
description: 输入网址一键提取正文的阅读器，自带中文界面；直接打开文章页面而不受登录墙与广告干扰。
author: wasi-master
license: MIT
homepage: https://github.com/wasi-master/13ft
min_os_version: 1.5.0
locales:
  zh-CN:
    name: 13ft
    description: 输入网址一键提取正文的阅读器，自带中文界面；把链接粘进来即可直接读取文章正文，页面干净、没有广告与弹窗干扰。
    usage: |
      13ft 是一个自托管的「文章正文提取」工具，界面为上游自带中文。

      用法：
      1. 打开应用，把要阅读的文章链接粘贴到输入框，点「提交」
      2. 页面会依次显示进度：连接网站 → 下载页面 → 检查反机器人挑战 → 处理文章 → 清理视图
      3. 处理完成后直接看到干净的正文视图；右上角可以切换深色模式
      4. 失败时会出现错误说明与「尝试另一个 URL」按钮

      说明：
      - 无需任何配置，也没有账号体系，打开即用
      - 应用本身不保存文章内容，每次请求现取现显
      - 部分网站会返回反机器人挑战或要求登录，这类页面会提示失败，属预期行为
      - 需要联网访问外部网站；受网络环境影响，部分站点可能超时（30 秒超时）
  en-US:
    name: 13ft
    description: A self-hosted article reader that pulls the main text out of any URL, with a clean reading view free of ads and pop-ups.
    usage: |
      13ft extracts the article body from a web page you paste in, and shows it
      in a clean reading view.

      Getting started:
      1. Open the app, paste the article URL into the field and submit.
      2. Progress steps are shown: connect, download, check for bot
         challenges, process the article, clean up the view.
      3. The reading view appears when done; a toggle switches dark mode.
      4. On failure an error explanation and a "try another URL" button appear.

      Notes:
      - No configuration and no accounts: it works as soon as it opens.
      - Article content is not stored; every request is fetched live.
      - Sites that answer with bot challenges or require login will fail with
        an explanation, which is expected behaviour.
      - Internet access is required; some sites may time out (30s limit).
permissions:
  required:
    - net.internet
  optional: []
