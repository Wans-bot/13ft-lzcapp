application:
  subdomain: thirteenft
  health_check:
    test_url: http://web:5000/
    disable: false
    start_period: 30s
    timeout: 5s
  upstreams:
    - location: /
      backend: http://web:5000

services:
  web:
    image: registry.lazycat.cloud/wans/wasi-master/13ft:4e6f6d4df11c77b0
    environment:
      # 上游按 LOCALE 环境变量选择界面语言（app/portable.py: get_locale()），
      # 固定 zh 即为上游原生中文，不做任何翻译或注入
      - LOCALE=zh
      - PORT=5000
