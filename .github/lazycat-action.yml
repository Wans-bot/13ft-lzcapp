# LazyCat GitHub Action 配置：跟随上游镜像标签自动更新 13ft 的 LPK
#
# 上游：wasi-master/13ft（MIT）
# 应用镜像：ghcr.io/wasi-master/13ft，标签形如 1.3.0
version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/13ft.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: 13ft

build:
  # 本工程不做源码构建，LPK 内容来自仓库内的 content/ 与 Manifest
  run_buildscript: false

images:
  - id: 13ft
    target: service
    service: app
    source: ghcr.io/wasi-master/13ft
    channel: stable
    # 跟随整支 1.x.y 版本族，不要写成当前版本，否则永远发现不了 1.4.0
    tag_regex: '^v?1\.\d+\.\d+$'
    sort: semver
    delivery:
      # 官方商店只接受 lazycat：由开发者平台远端复制到 registry.lazycat.cloud
      mode: lazycat

stores:
  # 首次提审需要 application 元数据块与已提交的截图；
  # 实机验收与截图完成前保持关闭，验证通过后再打开并提交。
  official:
    enabled: false
  private:
    enabled: false
